# Copy and edit for a new dataset / experiment.
#
# Tuned for NVIDIA RTX 5090 (32 GB GDDR7) + RFDETRLarge @ 704px.
# Refine batch size on your machine:
#   python -m rfdetr_tools fit-gpu --config configs/template.yaml --targets 16,32,64
#
# model.variant options: RFDETRNano, RFDETRSmall, RFDETRMedium, RFDETRLarge
# aug_preset options: conservative, aggressive, aerial, industrial

model:
  variant: RFDETRLarge
  resolution: 704  # RF-DETR default for Large (704×704); must be divisible by 32
  gradient_checkpointing: false  # 32 GB VRAM: keep off for speed; enable if OOM
  pretrain_weights: rf-detr-large-2026.pth

dataset_dir: dataset/my_task
output_dir: output/my_task_large

epochs: 100  # RF-DETR default; early stopping usually finishes sooner
batch_size: 16
grad_accum_steps: 2
auto_batch_target_effective: 32  # per-device effective batch (16 × 2)
lr: 1.0e-4
lr_encoder: 1.5e-4
device: cuda
num_workers: 8

aug_preset: aggressive
early_stopping: true
early_stopping_patience: 15  # RF-DETR docs recommendation
early_stopping_min_delta: 0.001
skip_best_epochs: 3
checkpoint_interval: 10

tensorboard: true
progress_bar: rich
log_file: train.log  # mirror console output; metrics.csv is always written too

