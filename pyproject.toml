[project]
name = "rfdetr-tools"
version = "0.1.0"
description = "Train, evaluate, export, and deploy RF-DETR object detection models"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
rfdetr-tools = "rfdetr_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rfdetr_tools"]

[tool.hatch.build.targets.sdist]
include = [
    "rfdetr_tools",
    "configs",
    "dataset",
    "README.md",
]
